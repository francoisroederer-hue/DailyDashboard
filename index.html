<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
<title>Daily — Carte du jour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  /* ---- Spécifique à la carte (canvas plein écran) ---- */
  html, body { height: 100%; overflow: hidden; }

  /* MINDMAP CANVAS */
  #graph {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }
  #graph:active { cursor: grabbing; }

  .link {
    stroke-opacity: 0.55;
    transition: stroke-opacity .2s, stroke-width .2s;
  }
  .link.dimmed { stroke-opacity: 0.08; }
  .link.cause { stroke-dasharray: none; }
  .link.meme_sujet { stroke-dasharray: 4 4; opacity: 0.45; }
  .link.tension { stroke-dasharray: 2 5; }
  .link.highlight { stroke-opacity: 1; stroke-width: 3; }

  .node { cursor: pointer; }
  .node .bubble-rect { transition: stroke-width .15s, opacity .2s, stroke .2s; }
  .node:hover .bubble-rect { stroke-width: 2.5; }
  .node.selected .bubble-rect {
    stroke: var(--ink) !important;
    stroke-width: 2.5 !important;
    filter: drop-shadow(0 0 18px currentColor) !important;
  }
  .node.dimmed .bubble-rect { opacity: 0.22 !important; filter: none !important; }
  .node.dimmed .bubble-text { opacity: 0.4; }

  /* LEGEND */
  .legend {
    position: fixed;
    bottom: 14px;
    left: 14px;
    right: 14px;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 8px;
    justify-content: center;
    padding: 8px 10px;
    background: rgba(20, 17, 15, 0.72);
    border: 1px solid var(--rule);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: opacity .25s, transform .25s;
  }
  body.panel-open .legend {
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
  }
  .legend-sep {
    width: 1px;
    height: 18px;
    background: var(--rule);
    margin: 0 4px;
    align-self: center;
  }
  .legend-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Geist Mono', monospace;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    white-space: nowrap;
    padding: 4px 4px;
  }
  .legend-link svg { display: block; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px 4px 6px;
    border-radius: 999px;
    font-family: 'Geist', sans-serif;
    font-size: 10.5px;
    font-weight: 500;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--rule);
    cursor: pointer;
    user-select: none;
    transition: all .15s;
    white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: var(--rule-bright); }
  .chip.active { color: var(--ink); border-color: currentColor; }
  .chip.muted { opacity: 0.35; }
  .chip .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  /* DETAIL PANEL */
  .panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--bg-panel);
    border-top: 1px solid var(--rule-bright);
    border-radius: 18px 18px 0 0;
    padding: 18px 20px 28px;
    transform: translateY(110%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    max-height: 70vh;
    overflow-y: auto;
    box-shadow: 0 -20px 60px rgba(0,0,0,0.6);
  }
  .panel.open { transform: translateY(0); }
  .panel-grip {
    width: 36px; height: 4px;
    background: var(--rule-bright);
    border-radius: 2px;
    margin: -6px auto 14px;
  }
  .panel-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .panel-close:hover { color: var(--ink); border-color: var(--rule-bright); }

  .panel-kicker {
    font-family: 'Geist Mono', monospace;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-faint);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-kicker .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--ink-dim);
  }
  .panel-kicker .badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .panel-title {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 72;
    font-weight: 500;
    font-size: 22px;
    line-height: 1.15;
    letter-spacing: -0.015em;
    margin-bottom: 10px;
    color: var(--ink);
  }
  .panel-body {
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .panel-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--rule-bright);
    padding-bottom: 1px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .panel-link:hover { color: var(--ink); }

  /* Edge panel */
  .edge-chain { display: flex; flex-direction: column; gap: 0; margin: 14px 0; }
  .edge-node {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px 0;
    border-top: 1px solid var(--rule);
  }
  .edge-node:first-of-type { border-top: none; padding-top: 4px; }
  .edge-node .e-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
    box-shadow: 0 0 8px currentColor;
  }
  .edge-node .e-content { flex: 1; min-width: 0; }
  .edge-node .e-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15px;
    line-height: 1.3;
    margin-bottom: 3px;
  }
  .edge-node .e-theme {
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-faint);
  }
  .edge-arrow {
    margin: 6px 0 6px 4px;
    padding-left: 16px;
    border-left: 2px dashed var(--rule-bright);
    color: var(--ink-dim);
    font-size: 12px;
    line-height: 1.5;
    font-style: italic;
    font-family: 'Fraunces', serif;
  }
  .edge-arrow::before {
    content: '↓';
    display: inline-block;
    margin-right: 6px;
    color: var(--accent);
    font-style: normal;
  }

  @media (min-width: 720px) {
    .legend { left: 50%; right: auto; transform: translateX(-50%); max-width: 720px; }
    .panel {
      left: auto;
      right: 16px;
      bottom: 16px;
      top: 16px;
      width: 420px;
      max-height: none;
      border-radius: 18px;
      border: 1px solid var(--rule-bright);
      transform: translateX(120%);
      padding-top: 24px;
    }
    .panel.open { transform: translateX(0); }
    .panel-grip { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="topline">
    <div class="masthead">Daily <span class="amp">&amp;</span> Co.</div>
    <div class="date-line" id="dateLine">
      —<br>
      <span class="meta" id="metaCount">chargement…</span>
    </div>
  </div>
  <nav class="tabs">
    <a class="tab active" href="index.html">Carte du jour</a>
    <a class="tab" href="supplements.html">Suppléments</a>
    <a class="tab" href="skincare.html">Skincare</a>
    <a class="tab" href="tennis.html">Tennis</a>
  </nav>
</header>

<svg id="graph"></svg>

<div class="legend" id="legend"></div>

<div class="panel" id="panel">
  <div class="panel-grip"></div>
  <button class="panel-close" id="panelClose">×</button>
  <div id="panelContent"></div>
</div>

<script>
// ============================================================
// FIXTURE DATA — sera remplacée par data/news.json (routine)
// ============================================================
const THEMES = {
  geopol:   { label: 'Géopolitique',  color: '#ef4444', cssVar: 't-geopol' },
  finance:  { label: 'Finance / Macro', color: '#eab308', cssVar: 't-finance' },
  tech:     { label: 'Tech',          color: '#06b6d4', cssVar: 't-tech' },
  learn:    { label: 'Apprentissage', color: '#6366f1', cssVar: 't-learn' },
  sante:    { label: 'Santé / Sport', color: '#f97316', cssVar: 't-sante' },
  climat:   { label: 'Climat',        color: '#10b981', cssVar: 't-climat' },
  sciences: { label: 'Sciences',      color: '#14b8a6', cssVar: 't-sciences' }
};

const DATA_URL = './data/news.json';

// ============================================================
// BOOTSTRAP
// ============================================================
fetch(DATA_URL, { cache: 'no-store' })
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(init)
  .catch(err => {
    document.body.insertAdjacentHTML('beforeend',
      `<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'Geist Mono',monospace;color:#9a8f80;font-size:13px;line-height:1.6;">
        Impossible de charger ${DATA_URL}<br><br>
        <span style="color:#5a5246">${err.message}</span><br><br>
        <span style="color:#5a5246">Vérifie que le fichier existe et que le serveur le sert (les fichiers locaux sur file:// sont bloqués — passe par GitHub Pages ou un serveur local).</span>
      </div>`);
  });

function init(DATA) {

// Header : date + compteurs depuis le JSON
const genDate = new Date(DATA.generated_at);
const fmtDate = genDate.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
document.getElementById('dateLine').innerHTML =
  fmtDate.charAt(0).toUpperCase() + fmtDate.slice(1) + '<br>' +
  `<span class="meta">${DATA.nodes.length} entrées · ${DATA.edges.length} liens</span>`;
document.title = `Daily — ${fmtDate}`;

// ============================================================
// RENDER
// ============================================================
const W = () => window.innerWidth;
const H = () => window.innerHeight;
const svg = d3.select('#graph').attr('viewBox', `0 0 ${W()} ${H()}`);

// Defs: arrow markers per theme color (we use neutral first, recolor inline)
const defs = svg.append('defs');
defs.append('marker')
  .attr('id', 'arrow')
  .attr('viewBox', '0 -5 10 10')
  .attr('refX', 16)
  .attr('refY', 0)
  .attr('markerWidth', 7)
  .attr('markerHeight', 7)
  .attr('orient', 'auto')
  .append('path')
  .attr('d', 'M0,-5L10,0L0,5')
  .attr('fill', '#9a8f80')
  .attr('opacity', 0.7);

const container = svg.append('g').attr('class', 'world');

// Zoom / pan
const zoom = d3.zoom()
  .scaleExtent([0.4, 3])
  .on('zoom', (e) => container.attr('transform', e.transform));
svg.call(zoom);

const nodeById = new Map(DATA.nodes.map(n => [n.id, n]));
const edges = DATA.edges.map(e => ({ ...e, source: nodeById.get(e.source), target: nodeById.get(e.target) }));

// Adjacency for filtering
const neighbors = new Map();
DATA.nodes.forEach(n => neighbors.set(n.id, new Set([n.id])));
DATA.edges.forEach(e => {
  neighbors.get(e.source).add(e.target);
  neighbors.get(e.target).add(e.source);
});

// Short titles : fallback si le JSON n'en a pas
DATA.nodes.forEach(n => { if (!n.short_title) n.short_title = n.title; });

// Bubble size by importance
const BUBBLE = {
  1: { w: 100, h: 36, r: 54 },
  2: { w: 140, h: 48, r: 74 },
  3: { w: 190, h: 64, r: 100 }
};

// Force sim — équilibrée, se fige rapidement avec un layout propre
const sim = d3.forceSimulation(DATA.nodes)
  .force('link', d3.forceLink(edges).id(d => d.id)
    .distance(d => d.type === 'meme_sujet' ? 145 : 105)
    .strength(d => d.type === 'cause' ? 0.6 : 0.32))
  .force('charge', d3.forceManyBody().strength(-520))
  .force('center', d3.forceCenter(W() / 2, H() / 2))
  .force('x', d3.forceX(W() / 2).strength(0.03))
  .force('y', d3.forceY(H() / 2).strength(0.04))
  .force('collision', d3.forceCollide().radius(d => Math.max(d._w || 80, d._h || 40) / 2 + 8))
  .alphaDecay(0.025)
  .alphaMin(0.005);

// Links — bande invisible large derrière chaque ligne pour faciliter le tap
const linkLayer = container.append('g').attr('class', 'links');

const linkHit = linkLayer.selectAll('line.hit')
  .data(edges)
  .enter().append('line')
  .attr('class', 'link-hit')
  .attr('stroke', 'transparent')
  .attr('stroke-width', 22)
  .style('cursor', 'pointer')
  .on('click', (event, d) => { event.stopPropagation(); selectEdge(d); });

const linkSel = linkLayer.selectAll('line.visible')
  .data(edges)
  .enter().append('line')
  .attr('class', d => `link ${d.type}`)
  .attr('stroke', d => {
    if (d.type === 'tension') return '#ef4444';
    if (d.type === 'meme_sujet') return '#5a5246';
    return THEMES[d.source.theme].color;
  })
  .attr('stroke-width', d => d.type === 'cause' ? 1.8 : 1.2)
  .attr('marker-end', d => d.type === 'cause' ? 'url(#arrow)' : null)
  .style('pointer-events', 'none');

// Nodes
const nodeSel = container.append('g')
  .attr('class', 'nodes')
  .selectAll('g')
  .data(DATA.nodes)
  .enter().append('g')
  .attr('class', 'node')
  .call(d3.drag()
    .on('start', function(event, d) {
      if (!event.active) sim.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
      d._tapStart = event.sourceEvent.timeStamp;
      d._x0 = event.x;
      d._y0 = event.y;
      d._moved = false;
    })
    .on('drag', (event, d) => {
      d.fx = event.x; d.fy = event.y;
      const dx = event.x - d._x0;
      const dy = event.y - d._y0;
      if (dx * dx + dy * dy > 100) d._moved = true; // seuil 10px
    })
    .on('end', function(event, d) {
      if (!event.active) sim.alphaTarget(0);
      d.fx = null; d.fy = null;
      const dt = event.sourceEvent.timeStamp - d._tapStart;
      if (!d._moved && dt < 500) {
        selectNode(d);
      }
    }));

// Bubbles: SVG natif rect + text (fiable sur tous navigateurs, y compris Safari iOS)
const PAD_X = { 1: 12, 2: 14, 3: 18 };
const FONT_SIZE = { 1: 11, 2: 13, 3: 15 };
const LINE_H = { 1: 13, 2: 15.5, 3: 18 };

function wrapText(text, maxChars) {
  const words = text.split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    if ((line + ' ' + w).trim().length > maxChars && line) {
      lines.push(line);
      line = w;
    } else {
      line = (line + ' ' + w).trim();
    }
  }
  if (line) lines.push(line);
  return lines.slice(0, 2);
}

const MAX_CHARS = { 1: 16, 2: 18, 3: 20 };

// Compute layout per node
DATA.nodes.forEach(n => {
  const lines = wrapText(n.short_title, MAX_CHARS[n.importance]);
  n._lines = lines;
  const fs = FONT_SIZE[n.importance];
  const lh = LINE_H[n.importance];
  // approx character width = fs * 0.55
  const maxW = Math.max(...lines.map(l => l.length)) * fs * 0.55;
  n._w = Math.max(maxW + PAD_X[n.importance] * 2, BUBBLE[n.importance].w);
  n._h = lines.length * lh + 16;
});

// Background rect per importance
const bgFill = {
  1: '#0a0908',
  2: '#14110f',
  3: '#1a1714'
};

nodeSel.append('rect')
  .attr('class', 'bubble-rect')
  .attr('x', d => -d._w / 2)
  .attr('y', d => -d._h / 2)
  .attr('width', d => d._w)
  .attr('height', d => d._h)
  .attr('rx', d => d._h / 2)
  .attr('ry', d => d._h / 2)
  .attr('fill', d => bgFill[d.importance])
  .attr('stroke', d => THEMES[d.theme].color)
  .attr('stroke-width', d => d.importance === 3 ? 2 : 1.5)
  .style('filter', d => d.importance === 3
    ? `drop-shadow(0 0 14px ${THEMES[d.theme].color}aa)`
    : d.importance === 2
      ? `drop-shadow(0 0 7px ${THEMES[d.theme].color}66)`
      : 'none')
  .style('opacity', d => d.importance === 1 ? 0.78 : 1);

nodeSel.append('text')
  .attr('class', 'bubble-text')
  .attr('text-anchor', 'middle')
  .attr('font-family', "'Fraunces', Georgia, serif")
  .attr('font-size', d => FONT_SIZE[d.importance])
  .attr('font-weight', d => d.importance === 3 ? 600 : 500)
  .attr('fill', '#f4ede4')
  .attr('pointer-events', 'none')
  .each(function(d) {
    const sel = d3.select(this);
    const lh = LINE_H[d.importance];
    const lines = d._lines;
    // center vertically
    const startY = -((lines.length - 1) * lh) / 2 + lh * 0.34;
    lines.forEach((line, i) => {
      sel.append('tspan')
        .attr('x', 0)
        .attr('y', startY + i * lh)
        .text(line);
    });
  });

sim.on('tick', () => {
  linkSel
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  linkHit
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
});

// ============================================================
// LEGEND
// ============================================================
const activeThemes = new Set(Object.keys(THEMES));
const legend = d3.select('#legend');

Object.entries(THEMES).forEach(([key, t]) => {
  const chip = legend.append('div')
    .attr('class', 'chip active')
    .style('color', t.color)
    .on('click', function() {
      if (activeThemes.has(key)) {
        activeThemes.delete(key);
        d3.select(this).classed('muted', true).classed('active', false);
      } else {
        activeThemes.add(key);
        d3.select(this).classed('muted', false).classed('active', true);
      }
      applyThemeFilter();
    });
  chip.append('span').attr('class', 'dot');
  chip.append('span').text(t.label);
});

// Mini-légende des types de liens
legend.append('div').attr('class', 'legend-sep');
const linkLegend = [
  { label: 'cause', dash: '', color: '#9a8f80', arrow: true },
  { label: 'même sujet', dash: '4 3', color: '#9a8f80', arrow: false },
  { label: 'tension', dash: '2 3', color: '#ef4444', arrow: false }
];
linkLegend.forEach(l => {
  const el = legend.append('div').attr('class', 'legend-link');
  const sv = el.append('svg').attr('width', 18).attr('height', 8).attr('viewBox', '0 0 18 8');
  sv.append('line')
    .attr('x1', 1).attr('y1', 4).attr('x2', l.arrow ? 13 : 17).attr('y2', 4)
    .attr('stroke', l.color).attr('stroke-width', 1.6)
    .attr('stroke-dasharray', l.dash || null);
  if (l.arrow) {
    sv.append('path').attr('d', 'M13,1 L17,4 L13,7 Z').attr('fill', l.color);
  }
  el.append('span').text(l.label);
});

function applyThemeFilter() {
  nodeSel.classed('dimmed', d => !activeThemes.has(d.theme));
  linkSel.classed('dimmed', d => !activeThemes.has(d.source.theme) || !activeThemes.has(d.target.theme));
}

// ============================================================
// SELECTION & PANEL
// ============================================================
const panel = document.getElementById('panel');
const panelContent = document.getElementById('panelContent');
document.getElementById('panelClose').onclick = closePanel;
svg.on('click', closePanel);

function closePanel() {
  panel.classList.remove('open');
  document.body.classList.remove('panel-open');
  nodeSel.classed('selected', false).classed('dimmed', d => !activeThemes.has(d.theme));
  linkSel.classed('highlight', false).classed('dimmed', d => !activeThemes.has(d.source.theme) || !activeThemes.has(d.target.theme));
}

function openPanel() {
  panel.classList.add('open');
  document.body.classList.add('panel-open');
}

function selectNode(d) {
  const t = THEMES[d.theme];
  // Highlight focus + neighbors
  const focusSet = neighbors.get(d.id);
  nodeSel.classed('selected', n => n.id === d.id)
    .classed('dimmed', n => !focusSet.has(n.id));
  linkSel.classed('highlight', e => e.source.id === d.id || e.target.id === d.id)
    .classed('dimmed', e => e.source.id !== d.id && e.target.id !== d.id);

  panelContent.innerHTML = `
    <div class="panel-kicker">
      <span class="badge" style="color: ${t.color}">${t.label}${d.subtopic ? ' · ' + escapeHtml(d.subtopic) : ''}</span>
      <span>· importance ${d.importance}/3</span>
    </div>
    <div class="panel-title">${escapeHtml(d.title)}</div>
    <div class="panel-body">${escapeHtml(d.summary)}</div>
    <a class="panel-link" href="${d.url}" target="_blank" rel="noopener">${d.source ? escapeHtml(d.source) + ' ↗' : 'Lire la source ↗'}</a>
  `;
  openPanel();
}

function selectEdge(e) {
  const src = e.source, tgt = e.target;
  const tSrc = THEMES[src.theme], tTgt = THEMES[tgt.theme];
  const typeLabels = {
    cause: 'Cause directe',
    meme_sujet: 'Même sujet',
    tension: 'Tension / divergence'
  };

  nodeSel.classed('selected', n => n.id === src.id || n.id === tgt.id)
    .classed('dimmed', n => n.id !== src.id && n.id !== tgt.id);
  linkSel.classed('highlight', l => l === e)
    .classed('dimmed', l => l !== e);

  panelContent.innerHTML = `
    <div class="panel-kicker">
      <span>${typeLabels[e.type]}</span>
    </div>
    <div class="panel-title" style="font-size:18px;margin-bottom:4px;">Lien entre deux entrées</div>
    <div class="edge-chain">
      <div class="edge-node">
        <span class="e-dot" style="background:${tSrc.color};color:${tSrc.color}"></span>
        <div class="e-content">
          <div class="e-title">${escapeHtml(src.title)}</div>
          <div class="e-theme">${tSrc.label}</div>
        </div>
      </div>
      <div class="edge-arrow">${escapeHtml(e.explanation)}</div>
      <div class="edge-node">
        <span class="e-dot" style="background:${tTgt.color};color:${tTgt.color}"></span>
        <div class="e-content">
          <div class="e-title">${escapeHtml(tgt.title)}</div>
          <div class="e-theme">${tTgt.label}</div>
        </div>
      </div>
    </div>
  `;
  openPanel();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Resize
window.addEventListener('resize', () => {
  svg.attr('viewBox', `0 0 ${W()} ${H()}`);
  sim.force('center', d3.forceCenter(W() / 2, H() / 2)).alpha(0.3).restart();
});

} // end init()
</script>

</body>
</html>
