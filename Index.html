- { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

body {
background: var(–bg);
color: var(–ink);
font-family: ‘Geist’, -apple-system, sans-serif;
font-weight: 400;
-webkit-font-smoothing: antialiased;
overscroll-behavior: none;
}

/* Grain overlay */
body::before {
content: ‘’;
position: fixed;
inset: 0;
pointer-events: none;
z-index: 1000;
opacity: 0.04;
background-image: url(“data:image/svg+xml,%3Csvg viewBox=‘0 0 200 200’ xmlns=‘http://www.w3.org/2000/svg’%3E%3Cfilter id=‘n’%3E%3CfeTurbulence type=‘fractalNoise’ baseFrequency=‘0.9’ numOctaves=‘3’/%3E%3C/filter%3E%3Crect width=‘100%25’ height=‘100%25’ filter=‘url(%23n)’/%3E%3C/svg%3E”);
}

/* HEADER */
header {
position: fixed; top: 0; left: 0; right: 0;
padding: 12px 16px 10px;
background: linear-gradient(to bottom, var(–bg) 60%, transparent);
z-index: 10;
display: flex;
align-items: baseline;
justify-content: space-between;
gap: 12px;
}
.masthead {
font-family: ‘Fraunces’, serif;
font-variation-settings: ‘opsz’ 144;
font-weight: 600;
font-style: italic;
font-size: 22px;
letter-spacing: -0.02em;
line-height: 1;
}
.masthead .amp {
color: var(–accent);
font-weight: 300;
}
.date-line {
font-family: ‘Geist Mono’, monospace;
font-size: 10px;
color: var(–ink-dim);
text-transform: uppercase;
letter-spacing: 0.15em;
text-align: right;
line-height: 1.3;
}
.date-line .meta { color: var(–ink-faint); }

/* MINDMAP CANVAS */
#graph {
position: fixed;
inset: 0;
width: 100vw;
height: 100vh;
cursor: grab;
}
#graph:active { cursor: grabbing; }

.link {
stroke-opacity: 0.55;
transition: stroke-opacity .2s, stroke-width .2s;
}
.link.dimmed { stroke-opacity: 0.08; }
.link.cause { stroke-dasharray: none; }
.link.meme_sujet { stroke-dasharray: 4 4; opacity: 0.45; }
.link.tension { stroke-dasharray: 2 5; }
.link.highlight { stroke-opacity: 1; stroke-width: 3; }

.node { cursor: pointer; }
.node foreignObject { overflow: visible; pointer-events: none; }
.bubble {
width: 100%;
height: 100%;
box-sizing: border-box;
display: flex;
align-items: center;
justify-content: center;
text-align: center;
border-radius: 999px;
padding: 6px 14px;
font-family: ‘Fraunces’, serif;
font-variation-settings: ‘opsz’ 14;
font-weight: 500;
color: var(–ink);
background: var(–bg-elev);
border: 1.5px solid var(–c);
box-shadow: 0 0 18px -3px var(–c), inset 0 0 0 1px rgba(0,0,0,0.35);
letter-spacing: -0.005em;
line-height: 1.18;
transition: box-shadow .2s, transform .2s, opacity .2s, background .2s;
pointer-events: auto;
-webkit-user-select: none;
user-select: none;
}
.bubble-text {
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}
.bubble.imp-1 {
font-size: 10px;
background: var(–bg);
box-shadow: 0 0 6px -2px var(–c), inset 0 0 0 1px rgba(0,0,0,0.4);
opacity: 0.7;
}
.bubble.imp-2 {
font-size: 12.5px;
background: var(–bg-elev);
}
.bubble.imp-3 {
font-size: 15px;
font-weight: 600;
font-variation-settings: ‘opsz’ 24;
background: var(–bg-panel);
box-shadow:
0 0 38px 0 var(–c),
inset 0 0 0 1px rgba(255,255,255,0.06),
inset 0 0 60px -12px var(–c);
}
.node:hover .bubble {
box-shadow: 0 0 28px -2px var(–c), inset 0 0 0 1px rgba(0,0,0,0.35);
transform: scale(1.04);
opacity: 1;
}
.node.selected .bubble {
background: var(–bg-panel);
border-width: 2px;
box-shadow: 0 0 34px -1px var(–c), 0 0 0 2px var(–bg), inset 0 0 0 1px rgba(0,0,0,0.4);
}
.node.dimmed .bubble { opacity: 0.25; box-shadow: none; }

/* LEGEND */
.legend {
position: fixed;
bottom: 14px;
left: 14px;
right: 14px;
z-index: 10;
display: flex;
flex-wrap: wrap;
gap: 6px 8px;
justify-content: center;
padding: 8px 10px;
background: rgba(20, 17, 15, 0.72);
border: 1px solid var(–rule);
border-radius: 14px;
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
}
.chip {
display: inline-flex;
align-items: center;
gap: 5px;
padding: 4px 9px 4px 6px;
border-radius: 999px;
font-family: ‘Geist’, sans-serif;
font-size: 10.5px;
font-weight: 500;
color: var(–ink-dim);
background: transparent;
border: 1px solid var(–rule);
cursor: pointer;
user-select: none;
transition: all .15s;
white-space: nowrap;
}
.chip:hover { color: var(–ink); border-color: var(–rule-bright); }
.chip.active { color: var(–ink); border-color: currentColor; }
.chip.muted { opacity: 0.35; }
.chip .dot {
width: 7px; height: 7px;
border-radius: 50%;
background: currentColor;
flex-shrink: 0;
}

/* DETAIL PANEL */
.panel {
position: fixed;
bottom: 0;
left: 0;
right: 0;
z-index: 100;
background: var(–bg-panel);
border-top: 1px solid var(–rule-bright);
border-radius: 18px 18px 0 0;
padding: 18px 20px 28px;
transform: translateY(110%);
transition: transform .3s cubic-bezier(.4,0,.2,1);
max-height: 70vh;
overflow-y: auto;
box-shadow: 0 -20px 60px rgba(0,0,0,0.6);
}
.panel.open { transform: translateY(0); }
.panel-grip {
width: 36px; height: 4px;
background: var(–rule-bright);
border-radius: 2px;
margin: -6px auto 14px;
}
.panel-close {
position: absolute;
top: 14px; right: 14px;
width: 28px; height: 28px;
border-radius: 50%;
background: transparent;
border: 1px solid var(–rule);
color: var(–ink-dim);
font-size: 14px;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
line-height: 1;
}
.panel-close:hover { color: var(–ink); border-color: var(–rule-bright); }

.panel-kicker {
font-family: ‘Geist Mono’, monospace;
font-size: 9.5px;
text-transform: uppercase;
letter-spacing: 0.18em;
color: var(–ink-faint);
margin-bottom: 4px;
display: flex;
align-items: center;
gap: 8px;
}
.panel-kicker .badge {
display: inline-flex;
align-items: center;
gap: 4px;
color: var(–ink-dim);
}
.panel-kicker .badge::before {
content: ‘’;
width: 6px; height: 6px;
border-radius: 50%;
background: currentColor;
}
.panel-title {
font-family: ‘Fraunces’, serif;
font-variation-settings: ‘opsz’ 72;
font-weight: 500;
font-size: 22px;
line-height: 1.15;
letter-spacing: -0.015em;
margin-bottom: 10px;
color: var(–ink);
}
.panel-body {
font-size: 14px;
line-height: 1.55;
color: var(–ink);
margin-bottom: 14px;
}
.panel-link {
display: inline-flex;
align-items: center;
gap: 6px;
font-family: ‘Geist Mono’, monospace;
font-size: 11px;
color: var(–accent);
text-decoration: none;
border-bottom: 1px solid var(–rule-bright);
padding-bottom: 1px;
text-transform: uppercase;
letter-spacing: 0.1em;
}
.panel-link:hover { color: var(–ink); }

/* Edge panel specifics */
.edge-chain {
display: flex;
flex-direction: column;
gap: 0;
margin: 14px 0;
}
.edge-node {
display: flex;
gap: 12px;
align-items: flex-start;
padding: 12px 0;
border-top: 1px solid var(–rule);
}
.edge-node:first-of-type { border-top: none; padding-top: 4px; }
.edge-node .e-dot {
width: 10px; height: 10px;
border-radius: 50%;
margin-top: 6px;
flex-shrink: 0;
box-shadow: 0 0 8px currentColor;
}
.edge-node .e-content { flex: 1; min-width: 0; }
.edge-node .e-title {
font-family: ‘Fraunces’, serif;
font-weight: 500;
font-size: 15px;
line-height: 1.3;
margin-bottom: 3px;
}
.edge-node .e-theme {
font-family: ‘Geist Mono’, monospace;
font-size: 9px;
text-transform: uppercase;
letter-spacing: 0.15em;
color: var(–ink-faint);
}
.edge-arrow {
margin: 6px 0 6px 4px;
padding-left: 16px;
border-left: 2px dashed var(–rule-bright);
color: var(–ink-dim);
font-size: 12px;
line-height: 1.5;
font-style: italic;
font-family: ‘Fraunces’, serif;
}
.edge-arrow::before {
content: ‘↓’;
display: inline-block;
margin-right: 6px;
color: var(–accent);
font-style: normal;
}

@media (min-width: 720px) {
header { padding: 18px 28px 12px; }
.masthead { font-size: 28px; }
.date-line { font-size: 11px; }
.legend { left: 50%; right: auto; transform: translateX(-50%); max-width: 720px; }
.panel {
left: auto;
right: 16px;
bottom: 16px;
top: 16px;
width: 420px;
max-height: none;
border-radius: 18px;
border: 1px solid var(–rule-bright);
transform: translateX(120%);
padding-top: 24px;
}
.panel.open { transform: translateX(0); }
.panel-grip { display: none; }
.bubble.imp-1 { font-size: 11px; }
.bubble.imp-2 { font-size: 13.5px; }
.bubble.imp-3 { font-size: 17px; }
}
</style>

</head>
<body>

<header>
  <div class="masthead">Daily <span class="amp">&amp;</span> Co.</div>
  <div class="date-line" id="dateLine">
    —<br>
    <span class="meta" id="metaCount">chargement…</span>
  </div>
</header>

<svg id="graph"></svg>

<div class="legend" id="legend"></div>

<div class="panel" id="panel">
  <div class="panel-grip"></div>
  <button class="panel-close" id="panelClose">×</button>
  <div id="panelContent"></div>
</div>

<script>
// ============================================================
// FIXTURE DATA — sera remplacée par data/news.json (routine)
// ============================================================
const THEMES = {
  geopol:   { label: 'Géopolitique',  color: '#ef4444', cssVar: 't-geopol' },
  finance:  { label: 'Finance / Macro', color: '#eab308', cssVar: 't-finance' },
  tech:     { label: 'Tech',          color: '#06b6d4', cssVar: 't-tech' },
  learn:    { label: 'Apprentissage', color: '#6366f1', cssVar: 't-learn' },
  sante:    { label: 'Santé / Sport', color: '#f97316', cssVar: 't-sante' },
  climat:   { label: 'Climat',        color: '#10b981', cssVar: 't-climat' },
  sciences: { label: 'Sciences',      color: '#14b8a6', cssVar: 't-sciences' }
};

const DATA_URL = './data/news.json';

// ============================================================
// BOOTSTRAP
// ============================================================
fetch(DATA_URL, { cache: 'no-store' })
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(init)
  .catch(err => {
    document.body.insertAdjacentHTML('beforeend',
      `<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'Geist Mono',monospace;color:#9a8f80;font-size:13px;line-height:1.6;">
        Impossible de charger ${DATA_URL}<br><br>
        <span style="color:#5a5246">${err.message}</span><br><br>
        <span style="color:#5a5246">Vérifie que le fichier existe et que le serveur le sert (les fichiers locaux sur file:// sont bloqués — passe par GitHub Pages ou un serveur local).</span>
      </div>`);
  });

function init(DATA) {

// Header : date + compteurs depuis le JSON
const genDate = new Date(DATA.generated_at);
const fmtDate = genDate.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
document.getElementById('dateLine').innerHTML =
  fmtDate.charAt(0).toUpperCase() + fmtDate.slice(1) + '<br>' +
  `<span class="meta">${DATA.nodes.length} entrées · ${DATA.edges.length} liens</span>`;
document.title = `Daily — ${fmtDate}`;

// ============================================================
// RENDER
// ============================================================
const W = () => window.innerWidth;
const H = () => window.innerHeight;
const svg = d3.select('#graph').attr('viewBox', `0 0 ${W()} ${H()}`);

// Defs: arrow markers per theme color (we use neutral first, recolor inline)
const defs = svg.append('defs');
defs.append('marker')
  .attr('id', 'arrow')
  .attr('viewBox', '0 -5 10 10')
  .attr('refX', 16)
  .attr('refY', 0)
  .attr('markerWidth', 7)
  .attr('markerHeight', 7)
  .attr('orient', 'auto')
  .append('path')
  .attr('d', 'M0,-5L10,0L0,5')
  .attr('fill', '#9a8f80')
  .attr('opacity', 0.7);

const container = svg.append('g').attr('class', 'world');

// Zoom / pan
const zoom = d3.zoom()
  .scaleExtent([0.4, 3])
  .on('zoom', (e) => container.attr('transform', e.transform));
svg.call(zoom);

const nodeById = new Map(DATA.nodes.map(n => [n.id, n]));
const edges = DATA.edges.map(e => ({ ...e, source: nodeById.get(e.source), target: nodeById.get(e.target) }));

// Adjacency for filtering
const neighbors = new Map();
DATA.nodes.forEach(n => neighbors.set(n.id, new Set([n.id])));
DATA.edges.forEach(e => {
  neighbors.get(e.source).add(e.target);
  neighbors.get(e.target).add(e.source);
});

// Short titles : fallback si le JSON n'en a pas
DATA.nodes.forEach(n => { if (!n.short_title) n.short_title = n.title; });

// Bubble size by importance
const BUBBLE = {
  1: { w: 100, h: 36, r: 54 },
  2: { w: 140, h: 48, r: 74 },
  3: { w: 190, h: 64, r: 100 }
};

// Force sim — équilibrée, se fige rapidement
const sim = d3.forceSimulation(DATA.nodes)
  .force('link', d3.forceLink(edges).id(d => d.id)
    .distance(d => d.type === 'meme_sujet' ? 130 : 100)
    .strength(d => d.type === 'cause' ? 0.55 : 0.28))
  .force('charge', d3.forceManyBody().strength(-360))
  .force('center', d3.forceCenter(W() / 2, H() / 2))
  .force('collision', d3.forceCollide().radius(d => BUBBLE[d.importance].r * 0.9))
  .alphaDecay(0.06)
  .alphaMin(0.04);

// Links — bande invisible large derrière chaque ligne pour faciliter le tap
const linkLayer = container.append('g').attr('class', 'links');

const linkHit = linkLayer.selectAll('line.hit')
  .data(edges)
  .enter().append('line')
  .attr('class', 'link-hit')
  .attr('stroke', 'transparent')
  .attr('stroke-width', 18)
  .style('cursor', 'pointer')
  .on('click', (event, d) => { event.stopPropagation(); selectEdge(d); });

const linkSel = linkLayer.selectAll('line.visible')
  .data(edges)
  .enter().append('line')
  .attr('class', d => `link ${d.type}`)
  .attr('stroke', d => {
    if (d.type === 'tension') return '#ef4444';
    if (d.type === 'meme_sujet') return '#5a5246';
    return THEMES[d.source.theme].color;
  })
  .attr('stroke-width', d => d.type === 'cause' ? 1.8 : 1.2)
  .attr('marker-end', d => d.type === 'cause' ? 'url(#arrow)' : null)
  .style('pointer-events', 'none');

// Nodes
const nodeSel = container.append('g')
  .attr('class', 'nodes')
  .selectAll('g')
  .data(DATA.nodes)
  .enter().append('g')
  .attr('class', 'node')
  .call(d3.drag()
    .clickDistance(8)  // tap si déplacement < 8px
    .on('start', function(event, d) {
      if (!event.active) sim.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
      d._tapStart = event.sourceEvent.timeStamp;
      d._moved = false;
    })
    .on('drag', (event, d) => {
      d.fx = event.x; d.fy = event.y;
      d._moved = true;
    })
    .on('end', function(event, d) {
      if (!event.active) sim.alphaTarget(0);
      d.fx = null; d.fy = null;
      const dt = event.sourceEvent.timeStamp - d._tapStart;
      // tap = appui court (<350ms) sans mouvement → ouvre le détail
      if (!d._moved && dt < 350) {
        selectNode(d);
      }
    }));

// Bubble: foreignObject + HTML div
nodeSel.append('foreignObject')
  .attr('width', d => BUBBLE[d.importance].w)
  .attr('height', d => BUBBLE[d.importance].h)
  .attr('x', d => -BUBBLE[d.importance].w / 2)
  .attr('y', d => -BUBBLE[d.importance].h / 2)
  .append('xhtml:div')
  .attr('class', d => `bubble imp-${d.importance}`)
  .attr('style', d => `--c: ${THEMES[d.theme].color}`)
  .html(d => `<span class="bubble-text">${escapeHtml(d.short_title)}</span>`);

sim.on('tick', () => {
  linkSel
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  linkHit
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
});

// ============================================================
// LEGEND
// ============================================================
const activeThemes = new Set(Object.keys(THEMES));
const legend = d3.select('#legend');

Object.entries(THEMES).forEach(([key, t]) => {
  const chip = legend.append('div')
    .attr('class', 'chip active')
    .style('color', t.color)
    .on('click', function() {
      if (activeThemes.has(key)) {
        activeThemes.delete(key);
        d3.select(this).classed('muted', true).classed('active', false);
      } else {
        activeThemes.add(key);
        d3.select(this).classed('muted', false).classed('active', true);
      }
      applyThemeFilter();
    });
  chip.append('span').attr('class', 'dot');
  chip.append('span').text(t.label);
});

function applyThemeFilter() {
  nodeSel.classed('dimmed', d => !activeThemes.has(d.theme));
  linkSel.classed('dimmed', d => !activeThemes.has(d.source.theme) || !activeThemes.has(d.target.theme));
}

// ============================================================
// SELECTION & PANEL
// ============================================================
const panel = document.getElementById('panel');
const panelContent = document.getElementById('panelContent');
document.getElementById('panelClose').onclick = closePanel;
svg.on('click', closePanel);

function closePanel() {
  panel.classList.remove('open');
  nodeSel.classed('selected', false).classed('dimmed', d => !activeThemes.has(d.theme));
  linkSel.classed('highlight', false).classed('dimmed', d => !activeThemes.has(d.source.theme) || !activeThemes.has(d.target.theme));
}

function selectNode(d) {
  const t = THEMES[d.theme];
  // Highlight focus + neighbors
  const focusSet = neighbors.get(d.id);
  nodeSel.classed('selected', n => n.id === d.id)
    .classed('dimmed', n => !focusSet.has(n.id));
  linkSel.classed('highlight', e => e.source.id === d.id || e.target.id === d.id)
    .classed('dimmed', e => e.source.id !== d.id && e.target.id !== d.id);

  panelContent.innerHTML = `
    <div class="panel-kicker">
      <span class="badge" style="color: ${t.color}">${t.label}${d.subtopic ? ' · ' + escapeHtml(d.subtopic) : ''}</span>
      <span>· importance ${d.importance}/3</span>
    </div>
    <div class="panel-title">${escapeHtml(d.title)}</div>
    <div class="panel-body">${escapeHtml(d.summary)}</div>
    <a class="panel-link" href="${d.url}" target="_blank" rel="noopener">${d.source ? escapeHtml(d.source) + ' ↗' : 'Lire la source ↗'}</a>
  `;
  panel.classList.add('open');
}

function selectEdge(e) {
  const src = e.source, tgt = e.target;
  const tSrc = THEMES[src.theme], tTgt = THEMES[tgt.theme];
  const typeLabels = {
    cause: 'Cause directe',
    meme_sujet: 'Même sujet',
    tension: 'Tension / divergence'
  };

  nodeSel.classed('selected', n => n.id === src.id || n.id === tgt.id)
    .classed('dimmed', n => n.id !== src.id && n.id !== tgt.id);
  linkSel.classed('highlight', l => l === e)
    .classed('dimmed', l => l !== e);

  panelContent.innerHTML = `
    <div class="panel-kicker">
      <span>${typeLabels[e.type]}</span>
    </div>
    <div class="panel-title" style="font-size:18px;margin-bottom:4px;">Lien entre deux entrées</div>
    <div class="edge-chain">
      <div class="edge-node">
        <span class="e-dot" style="background:${tSrc.color};color:${tSrc.color}"></span>
        <div class="e-content">
          <div class="e-title">${escapeHtml(src.title)}</div>
          <div class="e-theme">${tSrc.label}</div>
        </div>
      </div>
      <div class="edge-arrow">${escapeHtml(e.explanation)}</div>
      <div class="edge-node">
        <span class="e-dot" style="background:${tTgt.color};color:${tTgt.color}"></span>
        <div class="e-content">
          <div class="e-title">${escapeHtml(tgt.title)}</div>
          <div class="e-theme">${tTgt.label}</div>
        </div>
      </div>
    </div>
  `;
  panel.classList.add('open');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Resize
window.addEventListener('resize', () => {
  svg.attr('viewBox', `0 0 ${W()} ${H()}`);
  sim.force('center', d3.forceCenter(W() / 2, H() / 2)).alpha(0.3).restart();
});

} // end init()
</script>

</body>
</html>
